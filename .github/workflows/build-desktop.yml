name: Build Nook desktop and Android apps

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-script: dist:linux
            artifact-name: nook-linux-x64
            artifact-path: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            build-script: dist:windows
            artifact-name: nook-windows-x64
            artifact-path: release/*.exe
          - os: macos-latest
            build-script: dist:mac
            artifact-name: nook-macos
            artifact-path: |
              release/*.dmg
              release/*.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress

      - name: Build desktop installer
        run: npm run ${{ matrix.build-script }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package-android:
    name: nook-android-universal
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Android app
        run: npm run build:android

      - name: Package installable APK
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          cd android
          ./gradlew assembleDebug -PAPP_VERSION="$APP_VERSION"
          cd ..
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Nook-android-universal.apk

      - name: Upload Android installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nook-android-universal
          path: release/Nook-android-universal.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, package-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish installers and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --generate-notes \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
